name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm assets
      - run: pnpm test
      - run: pnpm build
      - run: mkdir -p android/app/src/main/assets/web && cp -R dist/. android/app/src/main/assets/web/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: bookscan-debug-signing-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p android assembleDebug lintDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk BookScan-AI.apk && sha256sum BookScan-AI.apk > BookScan-AI.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BookScan-AI-APK
          path: |
            BookScan-AI.apk
            BookScan-AI.apk.sha256
          retention-days: 30
